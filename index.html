<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>슬라임 받아쓰기 대모험</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Babel Standalone (브라우저에서 JSX 컴파일) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- React 및 아이콘 라이브러리 Import Map -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0"
      }
    }
  </script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    }
    
    /* 스크롤바 숨기기 (선택 사항) */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1; 
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8; 
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Volume2, Play, CheckCircle2, RotateCcw, Settings, ArrowRight, XCircle, Eraser, User, Lock, Plus, Save, ChevronLeft, Star, Award, Trash2 } from 'lucide-react';

    // 유틸리티: 배열 섞기
    const shuffleArray = (array) => {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    };

    // 유틸리티: 비슷한 모양/소리의 한글 함정 글자 생성
    const generateDecoyChar = (char) => {
      const charCode = char.charCodeAt(0);
      if (charCode < 0xAC00 || charCode > 0xD7A3) return ['은', '는', '이', '가'][Math.floor(Math.random() * 4)];

      const offset = charCode - 0xAC00;
      let onset = Math.floor(offset / 588);
      let nucleus = Math.floor((offset % 588) / 28);
      let coda = offset % 28;

      const changeType = Math.floor(Math.random() * 3);

      if (changeType === 0) {
        const onsetMap = {0:1, 1:0, 3:4, 4:3, 7:8, 8:7, 9:10, 10:9, 11:14, 14:11};
        onset = onsetMap[onset] !== undefined ? onsetMap[onset] : (onset + 1) % 19;
      } else if (changeType === 1) {
        const nucleusMap = {0:4, 4:0, 1:5, 5:1, 8:13, 13:8};
        nucleus = nucleusMap[nucleus] !== undefined ? nucleusMap[nucleus] : (nucleus + 1) % 21;
      } else {
        if (coda === 0) coda = [4, 8, 16, 21][Math.floor(Math.random() * 4)]; 
        else if (coda === 19) coda = 20; 
        else if (coda === 20) coda = 19; 
        else coda = 0; 
      }

      return String.fromCharCode(0xAC00 + (onset * 588) + (nucleus * 28) + coda);
    };

    // 획득 가능한 아이템 목록 (게임 리워드)
    const ITEM_POOL = ['🍎', '🍭', '💎', '🌟', '🎈', '🍪', '🌸', '🎁', '🚀', '👑', '🍉', '🍕', '🏆', '🌈'];

    // 슬라임 진화 단계 정의
    const getSlimeStage = (exp) => {
      if (exp < 50) return { level: 1, name: '아기 물방울 슬라임', color: '#93C5FD', size: 130, hasSprout: false };
      if (exp < 150) return { level: 2, name: '초록잎 꼬마 슬라임', color: '#86EFAC', size: 150, hasSprout: true };
      if (exp < 350) return { level: 3, name: '딸기맛 찰떡 슬라임', color: '#F9A8D4', size: 170, hasBubbles: true };
      if (exp < 700) return { level: 4, name: '마법사 은빛 슬라임', color: '#E2E8F0', size: 200, hasHat: true };
      return { level: 5, name: '대왕 황금 슬라임', color: '#FDE047', size: 230, hasCrown: true };
    };

    const SlimeCharacter = ({ exp, animate = false }) => {
      const stage = getSlimeStage(exp);
      
      return (
        <div className="relative flex flex-col items-center justify-center py-6 w-full mt-4">
          <div className="absolute top-0 z-20 bg-slate-800 text-white font-black px-6 py-2 rounded-xl border-4 border-slate-900 shadow-[0_4px_0_#0F172A] transform -translate-y-4">
            LV.{stage.level} {stage.name}
          </div>
          
          <div className="relative mt-8 h-[240px] flex items-end justify-center w-full">
            {stage.hasCrown && <div className="absolute top-0 text-7xl z-30 animate-bounce" style={{animationDuration: '2s'}}>👑</div>}
            {stage.hasHat && <div className="absolute top-4 text-7xl z-30 animate-bounce" style={{animationDuration: '2s'}}>🧙‍♂️</div>}
            
            <div className={`transition-all duration-1000 ease-in-out relative z-10 flex flex-col items-center
              ${animate ? 'animate-bounce' : 'animate-[pulse_3s_ease-in-out_infinite]'}`}
            >
              <svg width={stage.size} height={stage.size} viewBox="0 0 100 100" className="overflow-visible drop-shadow-2xl">
                 {stage.hasSprout && (
                    <path d="M 50,20 Q 40,0 65,5 Q 65,15 50,20" fill="#22C55E" stroke="#166534" strokeWidth="2" />
                 )}
                 {stage.hasBubbles && (
                    <g>
                       <circle cx="80" cy="15" r="7" fill="#FBCFE8" stroke="#BE185D" strokeWidth="2" />
                       <circle cx="82" cy="13" r="2" fill="#ffffff" />
                       <circle cx="92" cy="5" r="4" fill="#FBCFE8" stroke="#BE185D" strokeWidth="2" />
                    </g>
                 )}
                 <path d="M 15 65 Q 8 95 50 95 Q 92 95 85 65 Q 80 15 50 15 Q 20 15 15 65 Z" fill={stage.color} stroke="#1E293B" strokeWidth="3" />
                 <path d="M 25 45 Q 25 28 42 26 Q 35 43 25 45 Z" fill="rgba(255,255,255,0.7)" />
                 <ellipse cx="32" cy="63" rx="5" ry="7" fill="#1E293B" />
                 <circle cx="31" cy="61" r="2.5" fill="#ffffff" />
                 <ellipse cx="68" cy="63" rx="5" ry="7" fill="#1E293B" />
                 <circle cx="67" cy="61" r="2.5" fill="#ffffff" />
                 <ellipse cx="18" cy="72" rx="6" ry="3" fill="rgba(255,100,150,0.6)" />
                 <ellipse cx="82" cy="72" rx="6" ry="3" fill="rgba(255,100,150,0.6)" />
                 <path d="M 43 70 Q 46.5 76 50 70 Q 53.5 76 57 70" fill="none" stroke="#1E293B" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            </div>

            <div className="absolute bottom-[-20px] w-[280px] h-[60px] bg-indigo-900 rounded-[100%] border-4 border-slate-900 shadow-[0_10px_0_#0F172A] z-0">
               <div className="w-full h-full bg-indigo-500 rounded-[100%] transform -translate-y-2 border-4 border-slate-900 flex items-center justify-center">
                  <div className="w-[80%] h-[60%] bg-indigo-400 rounded-[100%]"></div>
               </div>
            </div>
          </div>
          
          <div className="mt-12 w-full max-w-sm bg-slate-800 rounded-full h-8 shadow-inner overflow-hidden border-4 border-slate-900 relative">
            <div 
              className="bg-yellow-400 h-full transition-all duration-1000 relative"
              style={{ width: `${Math.min(100, (exp % (stage.level === 5 ? 10000 : (stage.level * 150))))}%` }}
            >
              <div className="absolute top-0 left-0 w-full h-1/3 bg-white/40"></div>
            </div>
            <div className="absolute inset-0 flex items-center justify-center font-black text-white text-sm drop-shadow-md tracking-wider">
              EXP : {exp} / {stage.level === 5 ? 'MAX' : (stage.level * 150)}
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [view, setView] = useState('entry');
      
      const [modal, setModal] = useState({ isOpen: false, type: 'alert', message: '', onConfirm: null });

      const showAlert = (message) => setModal({ isOpen: true, type: 'alert', message, onConfirm: null });
      const showConfirm = (message, onConfirm) => setModal({ isOpen: true, type: 'confirm', message, onConfirm });
      const closeModal = () => setModal({ isOpen: false, type: 'alert', message: '', onConfirm: null });

      const [dictationLevels, setDictationLevels] = useState({
        '1급': ['나는 학교에 갑니다.', '친구가 참 좋습니다.', '우리 집 강아지 멍멍!'],
        '2급': ['비가 주룩주룩 내려요.', '무지개가 피었습니다.', '바람이 쌩쌩 붑니다.']
      });
      
      const [studentsData, setStudentsData] = useState({});
      const [currentUser, setCurrentUser] = useState(null);

      useEffect(() => {
        const savedLevels = localStorage.getItem('dictationLevels');
        if (savedLevels) setDictationLevels(JSON.parse(savedLevels));
        
        const savedStudents = localStorage.getItem('studentsData');
        if (savedStudents) setStudentsData(JSON.parse(savedStudents));
      }, []);

      const saveDictationLevels = (newLevels) => {
        setDictationLevels(newLevels);
        localStorage.setItem('dictationLevels', JSON.stringify(newLevels));
      };

      const saveStudentData = (studentName, newData) => {
        const updated = { ...studentsData, [studentName]: newData };
        setStudentsData(updated);
        localStorage.setItem('studentsData', JSON.stringify(updated));
      };

      const [teacherPwd, setTeacherPwd] = useState('');
      const [teacherSelectedLevel, setTeacherSelectedLevel] = useState('1급');
      const [teacherInputText, setTeacherInputText] = useState('');
      const [newLevelName, setNewLevelName] = useState('');

      const handleTeacherLogin = () => {
        if (teacherPwd === '1234') {
          setView('teacher_panel');
          setTeacherPwd('');
          setTeacherInputText(dictationLevels['1급']?.join('\n') || '');
        } else {
          showAlert('비밀번호가 틀렸습니다!\n다시 확인해주세요.');
        }
      };

      const handleSaveLevel = () => {
        const parsedSentences = teacherInputText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
        const newLevels = { ...dictationLevels, [teacherSelectedLevel]: parsedSentences };
        saveDictationLevels(newLevels);
        showAlert(`${teacherSelectedLevel} 문제가 성공적으로 저장되었습니다! 💾`);
      };

      const handleAddNewLevel = () => {
        if (!newLevelName.trim()) return;
        if (dictationLevels[newLevelName]) {
          showAlert('이미 존재하는 급수 이름입니다!');
          return;
        }
        const newLevels = { ...dictationLevels, [newLevelName]: [] };
        saveDictationLevels(newLevels);
        setTeacherSelectedLevel(newLevelName);
        setTeacherInputText('');
        setNewLevelName('');
      };

      const handleDeleteLevel = (levelToDelete, e) => {
        e.stopPropagation();
        if (Object.keys(dictationLevels).length <= 1) {
          showAlert('최소 1개의 급수는 남아있어야 합니다! 🚫');
          return;
        }
        showConfirm(`'${levelToDelete}' 급수를 정말 삭제하시겠습니까?\n포함된 모든 문제가 사라집니다! 🗑️`, () => {
          const newLevels = { ...dictationLevels };
          delete newLevels[levelToDelete];
          saveDictationLevels(newLevels);
          
          if (teacherSelectedLevel === levelToDelete) {
            const firstRemaining = Object.keys(newLevels)[0];
            setTeacherSelectedLevel(firstRemaining);
            setTeacherInputText(newLevels[firstRemaining].join('\n'));
          }
        });
      };

      const [loginName, setLoginName] = useState('');
      
      const handleStudentLogin = () => {
        if (!loginName.trim()) {
          showAlert('멋진 캐릭터 이름을 입력해주세요! 👾');
          return;
        }
        if (!studentsData[loginName]) {
          saveStudentData(loginName, { exp: 0, items: [] });
        }
        setCurrentUser(loginName);
        setView('student_lobby');
      };

      const [currentPracticeLevel, setCurrentPracticeLevel] = useState('');
      const [sentences, setSentences] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [targetSentence, setTargetSentence] = useState('');
      const [pool, setPool] = useState([]); 
      const [answerSlots, setAnswerSlots] = useState([]); 
      const [isChecking, setIsChecking] = useState(false);
      const [isCorrect, setIsCorrect] = useState(null);
      const [wrongAttempts, setWrongAttempts] = useState(0); 

      const [lastGainedExp, setLastGainedExp] = useState(0);
      const [lastGainedItem, setLastGainedItem] = useState(null);
      const [sessionExp, setSessionExp] = useState(0);
      const [sessionItems, setSessionItems] = useState([]);

      const startPractice = (levelName) => {
        const levelSentences = dictationLevels[levelName];
        if (!levelSentences || levelSentences.length === 0) {
          showAlert('이 스테이지(급수)에는 아직 문제가 없어요.\n선생님께 퀘스트 등록을 요청하세요! 📝');
          return;
        }
        setCurrentPracticeLevel(levelName);
        setSentences(levelSentences);
        setCurrentIndex(0);
        setSessionExp(0);
        setSessionItems([]);
        initProblem(levelSentences[0]);
        setView('practice');
      };

      const initProblem = (sentence) => {
        setTargetSentence(sentence);
        setIsChecking(false);
        setIsCorrect(null);
        setWrongAttempts(0);
        
        const chars = sentence.split('').map((char, index) => ({ id: `char_${index}`, char: char }));
        const extraPunctuation = ['.', ',', '?', '!', '~'];
        const puncDecoys = shuffleArray(extraPunctuation).slice(0, 3).map((char, index) => ({ id: `decoy_punc_${index}`, char: char }));
        const koreanChars = sentence.split('').filter(c => /[가-힣]/.test(c));
        const charDecoys = shuffleArray(koreanChars).slice(0, 3).map((char, index) => ({ id: `decoy_char_${index}`, char: generateDecoyChar(char) }));
        
        setPool(shuffleArray([...chars, ...puncDecoys, ...charDecoys]));
        setAnswerSlots([]);
      };

      const speakSentence = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ko-KR';
          utterance.rate = 0.8; 
          utterance.pitch = 1.2;
          window.speechSynthesis.speak(utterance);
        }
      };

      useEffect(() => {
        if (view === 'practice' && targetSentence) speakSentence(targetSentence);
      }, [view, currentIndex, targetSentence]);

      const handlePoolCardClick = (card) => {
        if (isChecking) return;
        if (answerSlots.length >= targetSentence.length) return; 
        setAnswerSlots([...answerSlots, card]);
        setPool(pool.filter(p => p.id !== card.id));
      };

      const handleSlotCardClick = (card, index) => {
        if (isChecking || !card) return; 
        const newSlots = [...answerSlots];
        newSlots.splice(index, 1);
        setAnswerSlots(newSlots);
        setPool([...pool, card]);
      };
      
      const handleBackspace = () => {
        if (isChecking || answerSlots.length === 0) return;
        const cardToReturn = answerSlots[answerSlots.length - 1];
        setAnswerSlots(answerSlots.slice(0, -1));
        setPool([...pool, cardToReturn]);
      };

      const handleCheckAnswer = () => {
        if (answerSlots.length !== targetSentence.length) return;
        
        setIsChecking(true);
        const userAnswerStr = answerSlots.map(c => c.char).join('');
        
        if (userAnswerStr === targetSentence) {
          setIsCorrect(true);
          speakSentence("참 잘했어요!");
          
          let expGained = 0;
          let newItem = null;
          
          if (wrongAttempts === 0) {
            expGained = 20; 
            if (Math.random() > 0.5) newItem = ITEM_POOL[Math.floor(Math.random() * ITEM_POOL.length)];
          } else if (wrongAttempts === 1) {
            expGained = 10;
          } else {
            expGained = 5;
          }
          
          setLastGainedExp(expGained);
          setLastGainedItem(newItem);
          
          setSessionExp(prev => prev + expGained);
          if (newItem) setSessionItems(prev => [...prev, newItem]);

          const studentProfile = studentsData[currentUser];
          const newTotalExp = studentProfile.exp + expGained;
          const newTotalItems = newItem ? [...studentProfile.items, newItem] : studentProfile.items;
          saveStudentData(currentUser, { exp: newTotalExp, items: newTotalItems });

        } else {
          setIsCorrect(false);
          setWrongAttempts(prev => prev + 1);
          speakSentence("다시 한번 생각해볼까요?");
        }
      };

      const handleNext = () => {
        if (currentIndex + 1 < sentences.length) {
          setCurrentIndex(currentIndex + 1);
          initProblem(sentences[currentIndex + 1]);
        } else {
          setView('result');
          speakSentence("모든 스테이지 클리어! 수고했어요!");
        }
      };

      const handleRetry = () => {
        setIsChecking(false);
        setIsCorrect(null);
      };

      const renderCard = (char, isPlaceholder = false) => {
        if (isPlaceholder) {
          return (
            <div className="w-12 h-12 md:w-16 md:h-16 lg:w-20 lg:h-20 bg-slate-100 border-4 border-dashed border-slate-300 rounded-2xl flex items-center justify-center m-1 shadow-inner"></div>
          );
        }
        const isSpace = char === ' ';
        return (
          <div className={`w-12 h-12 md:w-16 md:h-16 lg:w-20 lg:h-20 rounded-2xl flex items-center justify-center m-1 cursor-pointer transition-all transform active:scale-95 font-black text-2xl md:text-3xl lg:text-4xl border-4 border-slate-800
            ${isSpace 
              ? 'bg-indigo-100 text-indigo-400 shadow-[0_6px_0_#312E81] active:shadow-[0_0px_0_#312E81] active:translate-y-1' 
              : 'bg-yellow-300 text-slate-900 shadow-[0_6px_0_#1E293B] hover:bg-yellow-200 active:shadow-[0_0px_0_#1E293B] active:translate-y-1'}`}>
            {isSpace ? '␣' : char}
          </div>
        );
      };

      const gameBackground = {
        backgroundColor: '#F1F5F9',
        backgroundImage: 'radial-gradient(#CBD5E1 2px, transparent 2px)',
        backgroundSize: '30px 30px'
      };

      return (
        <div style={gameBackground} className="min-h-screen font-sans selection:bg-pink-300 relative overflow-hidden">
          
          {modal.isOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center border-4 border-slate-900 shadow-[0_12px_0_#0F172A] transform scale-100 animate-in zoom-in-95 duration-200">
                <p className="text-xl font-black text-slate-800 mb-8 whitespace-pre-wrap leading-relaxed">{modal.message}</p>
                <div className="flex gap-4 justify-center">
                  {modal.type === 'confirm' && (
                    <button 
                      onClick={closeModal} 
                      className="flex-1 bg-slate-200 text-slate-700 border-4 border-slate-900 p-4 rounded-2xl font-black text-lg shadow-[0_6px_0_#0F172A] active:shadow-[0_0px_0_#0F172A] active:translate-y-1 transition-all"
                    >
                      취소
                    </button>
                  )}
                  <button 
                    onClick={() => {
                      if(modal.onConfirm) modal.onConfirm();
                      closeModal();
                    }} 
                    className="flex-1 bg-blue-500 text-white border-4 border-slate-900 p-4 rounded-2xl font-black text-lg shadow-[0_6px_0_#0F172A] active:shadow-[0_0px_0_#0F172A] active:translate-y-1 transition-all"
                  >
                    확인
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {view === 'entry' && (
            <div className="min-h-screen flex flex-col items-center justify-center p-4 relative">
              <button 
                onClick={() => setView('teacher_login')} 
                className="absolute top-4 right-4 md:top-8 md:right-8 bg-slate-800 text-white p-3 md:p-4 rounded-full border-4 border-slate-900 shadow-[0_4px_0_#0F172A] hover:bg-slate-700 active:shadow-none active:translate-y-1 transition-all z-10 flex items-center gap-2"
                title="선생님 모드"
              >
                <Settings size={24} strokeWidth={3} />
                <span className="hidden md:inline font-black text-sm">ADMIN</span>
              </button>

              <div className="mb-12 relative">
                <h1 className="text-5xl md:text-7xl font-black text-white drop-shadow-[0_8px_0_#1E293B] text-center" style={{ textShadow: '-3px -3px 0 #1E293B, 3px -3px 0 #1E293B, -3px 3px 0 #1E293B, 3px 3px 0 #1E293B, 0 8px 0 #1E293B' }}>
                  슬라임<br/>받아쓰기 대모험
                </h1>
                <div className="absolute -top-10 -right-10 text-6xl animate-bounce">⚔️</div>
              </div>
              
              <div className="w-full max-w-md">
                <button onClick={() => setView('student_login')} className="w-full bg-pink-400 hover:bg-pink-300 border-4 border-slate-900 p-8 rounded-[2rem] shadow-[0_12px_0_#1E293B] active:shadow-[0_0px_0_#1E293B] active:translate-y-3 transition-all group flex flex-col items-center gap-4">
                  <div className="w-24 h-24 bg-white/30 text-slate-900 rounded-full border-4 border-slate-900 flex items-center justify-center group-hover:scale-110 transition-transform">
                    <Play size={48} strokeWidth={3} fill="currentColor" />
                  </div>
                  <h2 className="text-4xl font-black text-slate-900">GAME START</h2>
                  <p className="text-slate-800 font-bold text-lg">슬라임을 키우러 떠나자!</p>
                </button>
              </div>
            </div>
          )}

          {}
          {view === 'teacher_login' && (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="bg-white p-10 rounded-[2.5rem] border-4 border-slate-900 shadow-[0_16px_0_#0F172A] max-w-md w-full text-center relative">

    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
